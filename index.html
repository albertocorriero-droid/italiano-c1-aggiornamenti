<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Italiano C1 per Aya</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e6dfd3;--acc:#0e7c6b;--acc2:#e07a3f;--ok:#1a7f4b;--ko:#c0392b;--soft:#eef6f4}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1c222c;--ink:#eef0f4;--mute:#9aa3b2;--line:#2c3441;--acc:#3fc2ab;--acc2:#f0975f;--ok:#4cc58a;--ko:#ff7b6b;--soft:#1b2a29}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.top{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:1.1rem;margin:0}
.badge{background:var(--soft);color:var(--acc);border-radius:99px;padding:2px 12px;font-size:.85rem;font-weight:600}
nav{max-width:980px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
nav a{white-space:nowrap;text-decoration:none;color:var(--mute);padding:6px 12px;border-radius:8px;font-size:.92rem}
nav a.on{background:var(--acc);color:#fff}
main{max-width:980px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
h2{margin:.2em 0 .5em;font-size:1.25rem} h3{margin:.2em 0 .4em;font-size:1.02rem}
.mute{color:var(--mute);font-size:.92rem}
.ar{direction:rtl;text-align:right;font-family:"Geeza Pro","Noto Naskh Arabic","Arial",system-ui;font-size:1.08rem;line-height:1.8;margin:.3em 0}
.tip{background:var(--soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.rec-on{background:var(--ko)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--acc)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.ok{color:var(--ok);font-weight:600}.ko{color:var(--ko);font-weight:600;text-decoration:underline wavy}
.diff{font-size:1.1rem;line-height:1.9;margin:8px 0}
.choice{font-size:1.5rem;padding:16px 26px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer;font:inherit;font-size:.88rem}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rec{margin:8px 0} .rec audio{width:100%;margin-top:8px}
.score{font-size:1.05rem}
textarea,select,input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
select{width:auto}
a{color:var(--acc)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:.93rem}
.cur{background:var(--soft)}
.big{font-size:2rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:12px;padding:12px}
.flash{font-size:2rem;text-align:center;padding:26px 0}
#yt{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
nav.sub{margin-top:2px;border-top:1px dashed var(--line);padding-top:6px}
nav.sub a{font-size:.85rem;padding:4px 10px}
nav.sub a.on{background:var(--soft);color:var(--acc);font-weight:600}
nav[hidden]{display:none}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.62);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--card);border-radius:20px;max-width:520px;width:100%;padding:28px 24px;text-align:center;position:relative;z-index:22;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .trophy{font-size:3.4rem}
.modal h2{font-size:1.5rem;margin:.3em 0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:21}
.fab{position:fixed;right:16px;bottom:16px;z-index:12;width:54px;height:54px;border-radius:50%;border:0;background:var(--acc2);color:#fff;font-size:1.5rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid var(--line);z-index:15;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer[hidden]{display:none}
.drawer textarea{flex:1;resize:none;min-height:200px}
.notes{display:grid;grid-template-columns:260px 1fr;gap:14px}
@media (max-width:760px){.notes{grid-template-columns:1fr}}
.nitem{padding:8px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.nitem:hover{background:var(--soft)} .nitem.on{border-color:var(--acc);background:var(--soft)}
.tag{font-size:.75rem;background:var(--soft);color:var(--acc);border-radius:99px;padding:1px 8px;margin-left:6px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1px solid var(--line);padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;max-width:46px;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}
.bars i.low{background:var(--acc2)}
.bars span{font-size:.72rem;color:var(--mute);margin-top:4px}
.lbls{display:flex;gap:8px} .lbls span{flex:1;text-align:center;font-size:.8rem;color:var(--mute)}
.goal{border-top:2px dashed var(--acc2);position:relative}
.pill{display:inline-block;background:var(--soft);border-radius:99px;padding:2px 10px;margin:2px;font-size:.85rem}
.q{font-size:1.15rem;line-height:1.7}
details{margin:8px 0} summary{cursor:pointer;font-weight:600}
@media print{header,nav,.fab,.drawer,.noprint,#toast{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid;border:1px solid #bbb;box-shadow:none}main{max-width:none;padding:0}}
@media (max-width:600px){main{padding:12px}.choice{font-size:1.2rem;padding:12px 16px}}
</style>
<link rel="stylesheet" href="estetica.css">
</head>
<body>
<header>
  <div class="top"><h1>Italiano C1 · Aya</h1><span class="badge" id="wk"></span><span class="mute" id="streak"></span></div>
  <nav id="nav"></nav>
  <nav id="subnav" class="sub" hidden></nav>
</header>
<main id="main"></main>
<div id="toast"></div>
<script src="data.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="data4.js"></script>
<script src="foto/crediti.js"></script>
<script src="app.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
<script src="app4.js"></script>
<script src="app5.js"></script>
</body>
</html>
